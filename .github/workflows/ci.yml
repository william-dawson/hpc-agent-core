name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Facility tables up to date
        run: python scripts/render_facility_tables.py --check
      - name: Generated per-facility skills up to date
        run: python scripts/render_skills.py --check
      - name: Conformance (every facility, offline)
        run: python tests/conformance.py
