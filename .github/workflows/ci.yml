name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Facility tables up to date
        run: python scripts/render_facility_tables.py --check
      - name: Generated per-facility skills up to date
        run: python scripts/render_skills.py --check
      - name: Conformance (every facility, offline)
        run: python tests/conformance.py
      - name: A built wheel actually contains each facility's data
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist_check .
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist_check/*.whl"))[-1]).namelist()
          for needle in ("_guide.md", "chunks.json", "_config.json"):
              hits = [n for n in names if needle in n]
              assert hits, f"no {needle} in the wheel - facility data would not install"
              print(f"{needle}: {len(hits)} file(s)")
          PY
