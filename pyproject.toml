[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-agent-core"
version = "0.4.7"
description = "Shared runtime for the HPC MCP agent family: SSH middleware, PSI/J-style job models, scheduler backends, docs RAG, doctor, and serving, reused across per-machine plugins (Rikyu, HOKUSAI, Octopus, ...)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.0.0 (2026-07-17) renamed mcp.server.fastmcp.FastMCP to
    # mcp.server.mcpserver.MCPServer with no deprecation window, breaking
    # every consumer overnight since this was previously unpinned. Migrated
    # to MCPServer and pinning forward rather than capping at <2.0, so we
    # stay on the version we've actually tested against.
    "mcp>=2.0,<3.0",
    "remotemanager",
    "httpx",
    "numpy",
    "pydantic",
]

[project.urls]
Repository = "https://github.com/william-dawson/hpc-agent-core"

[tool.setuptools.packages.find]
include = ["hpc_agent_core*"]
